<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style2.css">
  </head>
  <body>
    <header>
      <h1>
        <center>
        THIS IS YOUR PET
        </center>
      </h1>
    </header>

    <main>
      <br>
      <div id="clock"></div>
      <section class="pet-image-container">
         <!-- Replace pet image with your own pet image -->
        <img id="myImage" class="pet-image" src="randomImageUrl" alt="Your Pet">
      
      </section >
      <br>
      <center>
      <p>
    click an action button to get started.
        </p>
        </center>
      <section class="dashboard">
  
        
    <!-- button section-->
      <aside>
        <div>Name: <strong><span id = "myParagraph" class="name"></span></strong></div>
        <div>Status: <strong><span class="status"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div class="button-container">
          <button class="treat-button action">
            Treat
          </button>
          <button class="play-button action2">
            Play
          </button>
          <button class="exercise-button action3">
            Exercise
          </button>
        </div>
        </aside>
      </section>
      <center>
       <p>Actions done <span id="clickCountDisplay">0</span> times.</p>
      </center>
      <section class = "settings">
       <aside>
      <button id="changeTextButton">Change Name</button> <button type="submit" onclick="refreshPage()">Restart Game</button>
         </aside>
   </section>
      
    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
